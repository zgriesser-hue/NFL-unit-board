name: cfb-board

# College football projections board: refreshes games and lines, grades this season so far, and projects the upcoming week's games.
# Writes boards/cfb_board_latest.csv (upcoming) and boards/cfb_board_graded_latest.csv (graded). Takes a few minutes.
# Runs by hand (Actions > cfb-board > Run workflow) and automatically Thursday and Friday mornings (US Eastern, ~8am).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 4,5"

permissions:
  contents: write

concurrency:
  group: cfb-board
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install pandas numpy scikit-learn requests
      - name: Download games and lines
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -u cfb_fetch.py
      - name: Download game-time weather (new games only)
        run: python -u cfb_fetch_weather.py
        continue-on-error: true
      - name: Build the board
        run: python -u cfb_board.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "nfl-bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add data/cfb_games.csv data/cfb_stats.csv data/cfb_venues.csv data/cfb_weather.csv boards/cfb_board_latest.csv boards/cfb_board_graded_latest.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "cfb board $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            sleep 5
          done
          exit 1
