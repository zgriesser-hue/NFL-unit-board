name: nfl-weekly-board

on:
  schedule:
    - cron: "0 22 * * 3"   # Wednesday 22:00 UTC (about 6pm ET): board after the first injury report
    - cron: "0 22 * * 5"   # Friday 22:00 UTC: board after the final injury report
    - cron: "0 14 * * 2"   # Tuesday 14:00 UTC: grade last week's games
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # so the job can commit the board files

concurrency:
  group: nfl-weekly-board
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Build the board
        if: github.event.schedule != '0 14 * * 2'   # the Tuesday run only grades, so it skips the board and the odds call
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional: leave the secret out to skip market capture
        run: python nfl_spread_pipeline.py

      - name: Build scheme profiles
        if: github.event.schedule != '0 14 * * 2'
        continue-on-error: true
        run: python scheme_profiles.py


      - name: Grade past boards
        run: python grade_boards.py

      - name: Commit results
        run: |
          git config user.name "nfl-bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add boards/ || true
          git add forward_test_summary.csv forward_test_games.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "board $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
